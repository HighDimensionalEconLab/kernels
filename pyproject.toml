[project]
name = "kernel_econ_alignment"
version = "0.1.0"
description = "Replication Code for Solving Models of Economic Dynamics with Ridgeless Kernel Regressions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.8",
    "jax>=0.11.0",
    "jsonargparse>=4.41.0",
    "matplotlib>=3.10.6",
    "nlls-gram>=2.7.0",
    "pandas>=2.3.2",
    "pyarrow>=24.0.0",
    "scipy>=1.18.0",
    "tinydiffeq>=2.4.0",
    "unopy>=0.4.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.20",
]
gpu = [
    "jax[cuda13]>=0.7.0 ; sys_platform == 'linux'",
]
sweep = [
    "wandb>=0.28.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

