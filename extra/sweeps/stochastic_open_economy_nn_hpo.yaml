# HPO for the float64 stochastic open-economy recursive NN at the single-IC
# default (train_T 60): bayes over MLP capacity, the num_epochs x max_steps
# split (frequent resamples vs long polishing), the shock ladder, LM settings,
# and trajectory count. Objective: median-seed test_euler_mean_abs_success
# (NaN when the solution is rejected, so acceptance and held-out accuracy
# optimize jointly). Solver thresholds and acceptance gates are the module's
# float64 defaults; the accepted default solve reaches mean 3.1e-6 and
# per-head max 3.9e-4, far inside the 5e-3 / 5e-2 bars.
# num_attempts is pinned to 2 (module default 4): a config that needs three
# restarts is a bad config, and rejecting it early buys trials -- a full
# 8-epoch x 250-step attempt is ~10 CPU-minutes at the T = 60 defaults.
# continuation_epochs > num_epochs combos raise and count as crashes.
# Launch: `wandb sweep extra/sweeps/stochastic_open_economy_nn_hpo.yaml`, then
# wandb agents (extra/sweeps/wandb_sweep_agent.sbatch; VENV=.venv-gpu on GPU).
program: extra/sweeps/wandb_sweep_wrapper.py
project: kernels
method: bayes
metric:
  name: test_euler_mean_abs_success
  goal: minimize
command:
  - ${env}
  - python
  - ${program}
  - ${args}
parameters:
  # --- wrapper config ---
  sweep_settings.script:               {value: stochastic_open_economy_growth_nn_recursive.py}
  sweep_settings.sort_criteria:        {value: test_euler_mean_abs_success}
  sweep_settings.num_seeds:            {value: 3}
  sweep_settings.starting_seed:        {value: 0}
  sweep_settings.min_successful_seeds: {value: 2}
  sweep_settings.log_tables:           {value: "false"}
  # --- fixed solver settings ---
  verbose:                             {value: false}
  use_float64:                         {value: true}
  stop_set.num_attempts:               {value: 2}
  # --- MLP axes ---
  nn_set.width:                 {values: [16, 32, 64, 128]}
  nn_set.depth:                 {values: [2, 3, 4]}
  nn_set.hidden_activation:     {values: [tanh, silu, gelu, softplus]}
  # --- epoch / ladder axes ---
  stop_set.num_epochs:          {values: [2, 3, 5, 8]}
  stop_set.max_steps:           {values: [25, 50, 100, 250]}
  stop_set.initial_shock_scale: {distribution: uniform, min: 0.05, max: 0.5}
  stop_set.continuation_epochs: {values: [1, 2, 3]}
  # --- LM axes ---
  lm_set.init_damping:          {distribution: log_uniform_values, min: 1e-7, max: 1e-2}
  lm_set.damping_decrease:      {distribution: uniform, min: 0.1, max: 0.9}
  lm_set.damping_increase:      {distribution: log_uniform_values, min: 1.5, max: 10.0}
  lm_set.geodesic_acceptance_ratio: {distribution: uniform, min: 0.5, max: 0.99}
  # --- data axes ---
  ic_set.num_train_trajectories: {values: [1, 2, 4, 8]}
  # Collocation density (train dt 1.9 / 1.25 / 0.94 / 0.625 at T = 60): cost
  # is ~linear in points, and a coarse grid may already integrate accurately
  # enough to accept. The held-out test grid stays fixed across trials.
  data_set.train_points:         {values: [33, 49, 65, 97]}
