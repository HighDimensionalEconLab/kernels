# HPO for the float32 stochastic open-economy recursive NN at the single-IC
# default: bayes over MLP capacity, the num_epochs x max_steps split (frequent
# resamples vs long polishing), the shock ladder, LM settings, and trajectory
# count. Objective: median-seed test_euler_mean_abs_success (NaN when the
# solution is rejected, so acceptance and held-out accuracy optimize
# jointly). Gates calibrated locally: an accepted float32 default solve
# reaches mean 1.7e-4 and per-head max 8.4e-3.
# continuation_epochs > num_epochs combos raise and count as crashes.
# Launch: `wandb sweep extra/sweeps/stochastic_open_economy_nn_hpo.yaml`, then
# wandb agents (extra/sweeps/wandb_sweep_agent.sbatch; VENV=.venv-gpu on GPU).
program: extra/sweeps/wandb_sweep_wrapper.py
project: kernels
method: bayes
metric:
  name: test_euler_mean_abs_success
  goal: minimize
command:
  - ${env}
  - python
  - ${program}
  - ${args}
parameters:
  # --- wrapper config ---
  sweep_settings.script:               {value: stochastic_open_economy_growth_nn_recursive.py}
  sweep_settings.sort_criteria:        {value: test_euler_mean_abs_success}
  sweep_settings.num_seeds:            {value: 5}
  sweep_settings.starting_seed:        {value: 0}
  sweep_settings.min_successful_seeds: {value: 3}
  sweep_settings.log_tables:           {value: "false"}
  # --- fixed solver settings (float32 replication bar) ---
  verbose:                             {value: false}
  use_float64:                         {value: false}
  stop_set.train_loss_threshold:       {value: 1e-6}
  tolerance_set.test_euler_mean_abs:   {value: 2e-3}
  tolerance_set.test_euler_max:        {value: 5e-2}
  # --- MLP axes ---
  nn_set.width:                 {values: [16, 32, 64, 128]}
  nn_set.depth:                 {values: [2, 3, 4]}
  nn_set.hidden_activation:     {values: [tanh, silu, gelu, softplus]}
  # --- epoch / ladder axes ---
  stop_set.num_epochs:          {values: [2, 3, 5, 8]}
  stop_set.max_steps:           {values: [25, 50, 100, 250, 500]}
  stop_set.initial_shock_scale: {distribution: uniform, min: 0.05, max: 0.5}
  stop_set.continuation_epochs: {values: [1, 2, 3]}
  # --- LM axes ---
  opt_set.init_damping:          {distribution: log_uniform_values, min: 1e-7, max: 1e-2}
  opt_set.damping_decrease:      {distribution: uniform, min: 0.1, max: 0.9}
  opt_set.damping_increase:      {distribution: log_uniform_values, min: 1.5, max: 10.0}
  opt_set.geodesic_acceptance_ratio: {distribution: uniform, min: 0.5, max: 0.99}
  # --- data axes ---
  ic_set.num_train_trajectories: {values: [2, 4, 8, 16]}
