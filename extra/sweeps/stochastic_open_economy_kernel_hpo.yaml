# HPO for the stochastic open-economy kernel-recursive solver: bayes over
# kernel geometry, ridge-LM settings, and design size. Metrics are euler
# errors and fit time only. num_train_trajectories is in the NN problem hash,
# so every swept count needs a pre-cached accepted float32 NN artifact in
# <policy_dir> BEFORE launching (a missing one is a loud FileNotFoundError):
#   for n in 2 4 8; do
#     python stochastic_open_economy_growth_nn_recursive.py \
#       --use_float64 false --stop_set.train_loss_threshold 1e-6 \
#       --tolerance_set.test_euler_mean_abs 1e-2 \
#       --tolerance_set.test_euler_max 1e-1 \
#       --ic_set.num_train_trajectories $n --policy_cache .results
#   done
# The kernel driver takes no NN seed; the wrapper's seed varies the design
# noise through ic_set.data_seed instead.
# Launch: `wandb sweep extra/sweeps/stochastic_open_economy_kernel_hpo.yaml`.
program: extra/sweeps/wandb_sweep_wrapper.py
project: kernels
method: bayes
metric:
  name: test_euler_mean_abs_success
  goal: minimize
command:
  - ${env}
  - python
  - ${program}
  - ${args}
parameters:
  # --- wrapper config ---
  sweep_settings.script:               {value: stochastic_open_economy_growth_kernel_recursive.py}
  sweep_settings.sort_criteria:        {value: test_euler_mean_abs_success}
  sweep_settings.seed_param:           {value: ic_set.data_seed}
  sweep_settings.num_seeds:            {value: 3}
  sweep_settings.starting_seed:        {value: 0}
  sweep_settings.min_successful_seeds: {value: 2}
  sweep_settings.log_tables:           {value: "false"}
  # --- fixed solver settings (float32 artifacts) ---
  verbose:                             {value: false}
  use_float64:                         {value: false}
  policy_dir:                          {value: .results}
  tolerance_set.test_euler_max:        {value: 1e-1}
  # --- kernel geometry ---
  kernel_set.lengthscale:    {distribution: log_uniform_values, min: 0.2, max: 2.0}
  kernel_set.amplitude:      {distribution: log_uniform_values, min: 0.3, max: 3.0}
  kernel_set.metric_epsilon: {distribution: log_uniform_values, min: 1e-6, max: 1e-3}
  kernel_set.state_kernel:   {values: [ard_rbf, ard_matern52, additive_rbf]}
  kernel_set.free_constant:  {values: [true, false]}
  kernel_set.linear_mean:    {values: [true, false]}
  # --- ridge-LM axes ---
  stop_set.max_steps:        {values: [50, 150, 300]}
  stop_set.residual_atol:    {distribution: log_uniform_values, min: 1e-6, max: 1e-4}
  stop_set.gtol:             {distribution: log_uniform_values, min: 1e-9, max: 1e-6}
  stop_set.ridge:            {distribution: log_uniform_values, min: 1e-14, max: 1e-8}
  opt_set.init_damping:      {distribution: log_uniform_values, min: 1e-8, max: 1e-3}
  opt_set.damping_decrease:  {distribution: uniform, min: 0.1, max: 0.9}
  opt_set.damping_increase:  {distribution: log_uniform_values, min: 1.5, max: 32.0}
  # --- design axes (does extra data help?) ---
  ic_set.num_train_trajectories: {values: [2, 4, 8]}
  data_set.train_points:         {values: [17, 33, 65]}
